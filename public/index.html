<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>flowerascii</title>
<meta name="description" content="A bouquet that blooms in ASCII: an empty vase, white sprinkles, seven flowers, turning.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6'/%3E%3Ctext x='16' y='29' font-size='34' text-anchor='middle' fill='%23ff4d94' font-family='monospace'%3E*%3C/text%3E%3C/svg%3E">
<link rel="preload" href="bloom.bin" as="fetch" crossorigin>
<style>
  :root {
    --paper: #f0ebe1;                 /* the vase's off-white */
    --petal: #ff4d94;                 /* the film's own flower */
    --quiet: #969cb0;                 /* the editor pane's bar text */
    --rule: #4b5263;
    --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, "DejaVu Sans Mono",
            "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; }
  body {
    display: grid;
    grid-template-rows: 1fr auto;
    font-family: var(--mono);
    color: var(--paper);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    display: grid;
    place-items: center;
    min-width: 0;
    min-height: 0;
    padding: 12px 12px 0;
    overflow: hidden;
  }
  canvas { display: block; opacity: 0; transition: opacity .5s ease; }
  canvas.on { opacity: 1; }
  [hidden] { display: none !important; }

  #start {
    font: inherit;
    font-size: clamp(2.25rem, 11vw, 5rem);
    font-weight: 700;
    letter-spacing: .32em;
    text-transform: uppercase;
    line-height: 1;
    padding: .62em .7em .62em 1.02em;   /* the tracking adds .32em on the right */
    color: var(--paper);
    background: #000;
    border: 3px solid var(--paper);
    border-radius: 0;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgb(255 77 148 / .0), .22em .22em 0 0 var(--petal);
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease,
                color .12s ease, opacity .25s ease;
    animation: breathe 2.6s ease-in-out infinite;
  }
  #start:hover, #start:focus-visible {
    background: var(--paper);
    color: #000;
    outline: none;
  }
  #start:focus-visible { outline: 3px solid var(--petal); outline-offset: 8px; }
  #start:active { transform: translate(.12em, .12em); box-shadow: .1em .1em 0 0 var(--petal); }
  #start:disabled { cursor: progress; animation: none; }
  #start.gone { opacity: 0; pointer-events: none; }
  @keyframes breathe {
    50% { box-shadow: 0 0 3.2rem .2rem rgb(255 77 148 / .38), .22em .22em 0 0 var(--petal); }
  }

  footer {
    height: 46px;
    display: grid;
    place-items: center;
  }
  #again {
    font: inherit;
    font-size: 13px;
    letter-spacing: .14em;
    padding: .5em 1.1em;
    color: var(--quiet);
    background: transparent;
    border: 1px solid var(--rule);
    cursor: pointer;
    opacity: 0;
    transition: opacity .6s ease, color .12s ease, border-color .12s ease;
  }
  #again.on { opacity: 1; }
  #again:hover, #again:focus-visible { color: var(--paper); border-color: var(--paper); outline: none; }

  @media (prefers-reduced-motion: reduce) {
    #start { animation: none; }
    canvas, #start, #again { transition: none; }
  }
</style>
</head>
<body>
<main>
  <button id="start" type="button">Start</button>
  <canvas id="screen" role="img" hidden
          aria-label="ASCII animation: white sprinkles drip onto an empty vase; seven flowers grow out of it and bloom while the bouquet turns."></canvas>
</main>
<footer><button id="again" type="button" hidden>replay</button></footer>

<script>
"use strict";
// The show was recorded by build_web.py from the terminal player (ascii_player.py):
// for every frame, the cells that changed.  This page only plays that back.
const FONT = getComputedStyle(document.documentElement).getPropertyValue("--mono");
const start = document.getElementById("start");
const again = document.getElementById("again");
const canvas = document.getElementById("screen");
const footer = document.querySelector("footer");
const ctx = canvas.getContext("2d", { alpha: false });

let show = null;                    // {cols, rows, fps, count, loop, glyphs, papers, frames}
let glyph, ink, paper;              // what every cell shows now
let cell = null;                    // how big a cell is, where each starts, the font
let cursor = -1;                    // the frame that is on screen
let clock = -1;                     // how many frames the show is old
let began = 0, hiddenAt = 0, timer = 0;

async function load() {
  if (!("DecompressionStream" in window)) throw new Error("old browser");
  const answer = await fetch("bloom.bin");
  if (!answer.ok) throw new Error("bloom.bin: " + answer.status);
  const plain = answer.body.pipeThrough(new DecompressionStream("gzip"));
  const buffer = await new Response(plain).arrayBuffer();
  const bytes = new Uint8Array(buffer), view = new DataView(buffer);
  if (String.fromCharCode(...bytes.subarray(0, 4)) !== "FLW2") throw new Error("not a show");
  const size = view.getUint32(4, true);
  const head = JSON.parse(new TextDecoder().decode(bytes.subarray(8, 8 + size)));
  const frames = [];
  let at = 8 + size;
  // one record per frame, and one more: the way from the last frame back to the
  // first frame of the last turn, which then goes round for ever
  for (let f = 0; f <= head.frames; f++) {
    const k = view.getUint16(at, true);
    at += 2;
    const where = new Uint16Array(k);
    for (let i = 0, spot = -1; i < k; i++) {    // each cell: so many after the last
      let step = bytes[at++];
      if (step === 255) { step = view.getUint16(at, true); at += 2; }
      where[i] = spot += step;
    }
    const ink = new Uint16Array(k);
    for (let i = 0; i < k; i++) ink[i] = view.getUint16(at + k + 2 * i, true);
    frames.push({ where, glyph: bytes.subarray(at, at + k), ink,
                  paper: bytes.subarray(at + 3 * k, at + 4 * k) });
    at += 4 * k;
  }
  // ink is 4 bits each of red, green and blue; backgrounds are a short list
  const inks = Array.from({ length: 4096 }, (_, c) =>
    `rgb(${(c >> 8) * 17},${(c >> 4 & 15) * 17},${(c & 15) * 17})`);
  const papers = head.papers.map(c => `rgb(${c >> 16},${c >> 8 & 255},${c & 255})`);
  return { ...head, count: head.frames, glyphs: Array.from(head.glyphs), inks, papers, frames };
}

// The canvas is as big as the window allows, and a cell is twice as tall as it is
// wide: the picture was laid out for that.  Cells are a whole number of device pixels
// wide where that costs little room; either way they start on whole pixels.
function fit() {
  const ratio = window.devicePixelRatio || 1;
  const wide = (window.innerWidth - 24) * ratio;
  const high = (window.innerHeight - footer.offsetHeight - 24) * ratio;
  let w = Math.max(Math.min(wide / show.cols, high / (2 * show.rows)), 2);
  if (Math.floor(w) >= 0.93 * w) w = Math.floor(w);
  const xs = Int32Array.from({ length: show.cols + 1 }, (_, i) => Math.round(i * w));
  const ys = Int32Array.from({ length: show.rows + 1 }, (_, i) => Math.round(i * 2 * w));
  canvas.width = xs[show.cols];
  canvas.height = ys[show.rows];
  canvas.style.width = canvas.width / ratio + "px";
  canvas.style.height = canvas.height / ratio + "px";
  ctx.font = `100px ${FONT}`;
  const m = ctx.measureText("M");
  const up = (m.fontBoundingBoxAscent || 80) / 100, down = (m.fontBoundingBoxDescent || 20) / 100;
  const font = Math.min(w / (m.width / 100), 2 * w / (up + down));
  cell = { w, xs, ys, font, base: (2 * w - (up + down) * font) / 2 + up * font };
  paint();
}

function paint() {
  const { cols, rows, glyphs, inks, papers } = show, { w, xs, ys, font, base } = cell;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // backgrounds (the editor pane), in runs of one color
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols;) {
      const back = paper[y * cols + x];
      let end = x + 1;
      while (end < cols && paper[y * cols + end] === back) end++;
      if (back) {                               // (0 is black)
        ctx.fillStyle = papers[back];
        ctx.fillRect(xs[x], ys[y], xs[end] - xs[x], ys[y + 1] - ys[y]);
      }
      x = end;
    }
  }
  ctx.font = `${font}px ${FONT}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  let last = -1;
  for (let i = 0; i < cols * rows; i++) {
    if (!glyph[i]) continue;                    // 0: a blank
    if (ink[i] !== last) ctx.fillStyle = inks[last = ink[i]];
    const column = i % cols, row = (i - column) / cols, c = glyphs[glyph[i]];
    const x = xs[column], y = ys[row], middle = (x + xs[column + 1]) / 2;
    // three characters that fonts disagree about are drawn by hand
    if (c === "●") {                            // a window button
      ctx.beginPath();
      ctx.arc(middle, y + w, w * 0.42, 0, 2 * Math.PI);
      ctx.fill();
    } else if (c === "▎") {                     // the current-line marker
      ctx.fillRect(x, y, Math.max(Math.round(w / 4), 1), ys[row + 1] - y);
    } else if (c === "—") {                     // the dash in the title
      ctx.fillRect(x, y + Math.round(w * 1.04), xs[column + 1] - x, Math.max(Math.round(font / 14), 1));
    } else {
      ctx.fillText(c, middle, y + base);
    }
  }
}

function apply(frame) {
  const { where } = frame;
  for (let i = 0; i < where.length; i++) {
    const at = where[i];
    glyph[at] = frame.glyph[i];
    ink[at] = frame.ink[i];
    paper[at] = frame.paper[i];
  }
}

// One frame on: the next one, or - after the last - back to where the last turn
// began, so that the finished bouquet goes on turning.
function step() {
  if (cursor < show.count - 1) {
    apply(show.frames[++cursor]);
  } else if (show.loop < show.count) {
    apply(show.frames[show.count]);
    cursor = show.loop;
  }
}

function tick(now) {
  const due = Math.floor((now - began) / 1000 * show.fps);
  let behind = due - clock;
  if (behind > 0) {
    if (behind > 5 * show.fps) {                // a long sleep: do not race after it
      began += (behind - 1) / show.fps * 1000;
      behind = 1;
    }
    clock += behind;
    while (behind-- > 0) step();
    paint();
  }
  if (clock === show.count - 1 || (clock >= show.count && again.hidden)) {
    again.hidden = false;                       // all have bloomed: offer to replay
    requestAnimationFrame(() => again.classList.add("on"));
  }
  if (clock < show.count - 1 || show.loop < show.count) timer = requestAnimationFrame(tick);
  else timer = 0;
}

function play() {
  const cells = show.cols * show.rows;
  glyph = new Uint8Array(cells);
  ink = new Uint16Array(cells);
  paper = new Uint8Array(cells);
  cursor = clock = -1;
  again.classList.remove("on");
  again.hidden = true;
  canvas.hidden = false;
  fit();
  canvas.classList.add("on");
  began = performance.now();
  cancelAnimationFrame(timer);
  timer = requestAnimationFrame(tick);
}

const ready = load();
ready.catch(() => {});                          // (reported when Start is pressed)

start.addEventListener("click", async () => {
  start.disabled = true;
  const slow = setTimeout(() => { start.textContent = "Loading"; }, 250);
  try {
    show = await ready;
  } catch (error) {
    clearTimeout(slow);
    start.style.fontSize = "1.1rem";
    start.style.letterSpacing = ".08em";
    start.textContent = error.message === "old browser"
      ? "This browser is too old for the show" : "Could not load the show. Reload to try again";
    return;
  }
  clearTimeout(slow);
  start.classList.add("gone");
  setTimeout(() => { start.hidden = true; play(); }, 260);
});

again.addEventListener("click", play);
window.addEventListener("resize", () => { if (show && !canvas.hidden) fit(); });
// a hidden tab gets no frames: stop the clock there, so the show goes on where it was
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = performance.now();
  else if (hiddenAt) { began += performance.now() - hiddenAt; hiddenAt = 0; }
});
</script>
</body>
</html>
